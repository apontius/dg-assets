<!-- MAILERLITE BLOCK 1 OF 5 -->
<style>
/* Scoped styles protect this page from older MailerLite component styles. */
.dg-pif{--green:#1a3a3a;--gold:#c8963e;--sand:#f5f0e8;--paper:#faf8f4;--ink:#2a2a2a;--body:#3d3d3d;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);color:var(--body);font:17px/1.75 Georgia,'Times New Roman',serif;text-align:left;overflow-wrap:break-word}
.dg-pif,.dg-pif *,.dg-pif *::before,.dg-pif *::after{box-sizing:border-box}
.dg-pif *{margin:0}
.dg-pif .pif-wrap{width:100%;max-width:1080px;padding:0 24px;margin:0 auto}
.dg-pif a{color:#79581e;text-decoration:underline;text-underline-offset:4px}
.dg-pif a:hover{color:var(--green)}
.dg-pif :focus-visible{outline:3px solid #a77623;outline-offset:5px}
.dg-pif h1,.dg-pif h2{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;letter-spacing:-.025em;line-height:1.2;color:var(--green);text-transform:none}
.dg-pif h1{font-size:clamp(36px,5vw,58px);max-width:620px}
.dg-pif h2{font-size:clamp(28px,3.4vw,38px)}
.dg-pif h3{font:600 19px/1.4 var(--sans);color:var(--green);margin-bottom:12px}
.dg-pif p+p{margin-top:16px}
.dg-pif .pif-label{font:600 12px/1.5 var(--sans);text-transform:uppercase;letter-spacing:.14em;color:#79581e;margin-bottom:14px}
.dg-pif .pif-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:14px 24px;border:1px solid transparent;border-radius:6px;background:var(--gold);color:var(--green);font:600 16px/1.4 var(--sans);text-decoration:none;text-align:center;cursor:pointer;transition:background .2s}
.dg-pif .pif-btn:hover{background:#d4a84f;color:var(--green);text-decoration:none}
.dg-pif .pif-btn[aria-disabled=true]{opacity:.6;cursor:not-allowed}
.dg-pif .pif-btn-secondary{background:transparent;border-color:#b9c5bf;color:var(--green)}
.dg-pif .pif-btn-secondary:hover{background:#e9ede9}
.dg-pif .pif-header{background:var(--green);border-bottom:2px solid var(--gold)}
.dg-pif .pif-header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:18px;padding-bottom:18px}
.dg-pif .pif-logo{display:block;height:56px;width:auto;max-width:100%;object-fit:contain}
.dg-pif .pif-home{font:14px/1.4 var(--sans);color:var(--sand);white-space:nowrap;text-decoration:none;padding:10px 0}
.dg-pif .pif-hero{padding:64px 0 56px}
.dg-pif .pif-hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:56px;align-items:start}
.dg-pif .pif-intro{font:18px/1.8 var(--sans);max-width:580px;margin-top:24px}
.dg-pif .pif-book-image{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:8px;margin-top:32px}
.dg-pif .pif-dave-quote{border-left:3px solid var(--gold);padding:0 0 0 20px;margin:24px 0 0;font:italic 21px/1.6 Georgia,serif;color:var(--green)}
.dg-pif .pif-origin{margin-top:24px}
.dg-pif .pif-origin h2{font-size:25px;margin-bottom:14px}
.dg-pif .pif-origin p{font:16px/1.8 var(--sans)}
.dg-pif .pif-section-head .pif-dave-quote{border-left:0;padding:0;margin:24px auto 0;max-width:620px}
.dg-pif .pif-caption{font:13px/1.6 var(--sans);margin-top:10px;color:#646464}
.dg-pif .pif-contribute{background:#fff;border:1px solid #dfd6c6;border-top:4px solid var(--gold);border-radius:8px;padding:30px;box-shadow:0 12px 32px #1a3a3a0a;scroll-margin-top:24px}
.dg-pif .pif-contribute h2{font-size:31px;margin-bottom:18px}
.dg-pif .pif-contribute>p{font:16px/1.7 var(--sans)}
.dg-pif .pif-contribute .pif-btn{width:100%;margin-top:24px}
.dg-pif .pif-payment-note{font:13px/1.6 var(--sans)!important;color:#646464;text-align:center;margin-top:12px}
.dg-pif .pif-tax-note{font:12px/1.7 var(--sans)!important;color:#646464;text-align:center;margin-top:8px}
.dg-pif .pif-amount-note{font:14px/1.7 var(--sans)!important;background:var(--sand);border-radius:6px;padding:12px 14px;margin-top:18px}
.dg-pif .pif-larger{max-width:760px;margin:24px auto 0;font:15px/1.8 var(--sans);text-align:center}
.dg-pif .pif-free-note{border-top:1px solid #e9e2d8;padding-top:20px;margin-top:24px;font:14px/1.7 var(--sans)}
.dg-pif .pif-free-note a{display:inline-block;margin-top:8px}
.dg-pif .pif-section{padding:56px 0}
.dg-pif .pif-section-head{text-align:center;max-width:680px;margin:0 auto 30px}
.dg-pif .pif-section-head>p:last-child{margin-top:18px}
.dg-pif .pif-sand{background:var(--sand)}
.dg-pif .pif-three{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.dg-pif .pif-feature{padding:22px 0;border-top:2px solid #c8963e70}
.dg-pif .pif-feature p{font:16px/1.8 var(--sans)}
.dg-pif .pif-proof{max-width:760px;margin:0 auto;text-align:center;padding:44px 24px}
.dg-pif .pif-proof blockquote{font:italic 26px/1.6 Georgia,serif;color:var(--green)}
</style>
